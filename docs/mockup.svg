<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Segoe UI, Hiragino Kaku Gothic ProN, sans-serif">
  <rect width="900" height="500" fill="#0C1622"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="190" height="500" fill="#111F31"/>
  <line x1="190" y1="0" x2="190" y2="500" stroke="#22405F" stroke-width="1"/>
  <circle cx="24" cy="30" r="4.5" fill="#06B6D4"/>
  <text x="36" y="34" fill="#E8EFF6" font-size="14" font-weight="600">Bedrock Chat</text>

  <rect x="14" y="52" width="162" height="30" rx="8" fill="none" stroke="#22405F"/>
  <text x="28" y="71" fill="#9DB3C9" font-size="12">＋ 新しいチャット</text>

  <rect x="14" y="96" width="162" height="24" rx="6" fill="#16283D"/>
  <rect x="14" y="96" width="2" height="24" fill="#06B6D4"/>
  <text x="24" y="112" fill="#E8EFF6" font-size="12">SBCのINI設定を確認したい</text>
  <text x="24" y="140" fill="#9DB3C9" font-size="12">議事録の要約</text>
  <text x="24" y="164" fill="#9DB3C9" font-size="12">提案書のレビュー</text>

  <line x1="0" y1="462" x2="190" y2="462" stroke="#22405F" stroke-width="1"/>
  <text x="16" y="482" fill="#6C88A5" font-size="10.5" font-family="Consolas, monospace">us-east-1 · proxy · ca</text>

  <!-- header -->
  <line x1="190" y1="52" x2="900" y2="52" stroke="#22405F" stroke-width="1"/>
  <text x="212" y="32" fill="#9DB3C9" font-size="15">☰</text>
  <rect x="238" y="16" width="220" height="26" rx="7" fill="#16283D" stroke="#22405F"/>
  <text x="250" y="33" fill="#E8EFF6" font-size="12">Claude Sonnet 4.5</text>
  <text x="440" y="33" fill="#6C88A5" font-size="11">⌄</text>
  <text x="740" y="32" fill="#6C88A5" font-size="10.5" font-family="Consolas, monospace">in 812 / out 344 tok</text>
  <text x="854" y="32" fill="#9DB3C9" font-size="14">⚙</text>
  <text x="878" y="32" fill="#9DB3C9" font-size="14">⭳</text>

  <!-- user message -->
  <rect x="212" y="78" width="26" height="26" rx="7" fill="#1B3350"/>
  <text x="225" y="95" fill="#9DB3C9" font-size="9" text-anchor="middle">You</text>
  <text x="250" y="88" fill="#6C88A5" font-size="10.5">あなた</text>
  <text x="250" y="106" fill="#E8EFF6" font-size="13">Genesys Cloud の BYOC Premises 構成で、SBC 側に必要な SIP 設定を教えて</text>

  <!-- assistant message -->
  <rect x="212" y="134" width="26" height="26" rx="7" fill="#1D9E75"/>
  <text x="225" y="151" fill="#04342C" font-size="11" text-anchor="middle" font-weight="600">C</text>
  <text x="250" y="144" fill="#6C88A5" font-size="10.5">Claude</text>

  <rect x="250" y="152" width="150" height="22" rx="8" fill="none" stroke="#22405F" stroke-dasharray="3,2"/>
  <text x="262" y="166" fill="#6C88A5" font-size="10">⌄ 思考プロセス</text>

  <text x="250" y="196" fill="#E8EFF6" font-size="13">SBC 側では最低限この3つを合わせます。</text>

  <rect x="250" y="208" width="500" height="78" rx="8" fill="#0A121C" stroke="#22405F"/>
  <rect x="700" y="216" width="42" height="16" rx="5" fill="none" stroke="#22405F"/>
  <text x="708" y="227" fill="#6C88A5" font-size="9">コピー</text>
  <text x="262" y="234" fill="#9DB3C9" font-size="11.5" font-family="Consolas, monospace">IPProfile 1 = SBC-GenesysCloud</text>
  <text x="262" y="252" fill="#9DB3C9" font-size="11.5" font-family="Consolas, monospace">SBCRouting <tspan fill="#8BE9FD">IP2IP</tspan> = 1</text>
  <text x="262" y="270" fill="#9DB3C9" font-size="11.5" font-family="Consolas, monospace">TransportType = TLS</text>

  <!-- composer -->
  <line x1="190" y1="420" x2="900" y2="420" stroke="#22405F" stroke-width="1"/>
  <rect x="212" y="438" width="666" height="38" rx="12" fill="#111F31" stroke="#22405F"/>
  <text x="230" y="461" fill="#6C88A5" font-size="12.5">メッセージを入力…</text>
  <circle cx="854" cy="457" r="15" fill="#B91C1C"/>
  <rect x="849" y="452" width="10" height="10" fill="#fff"/>
  <text x="212" y="492" fill="#6C88A5" font-size="10.5">Enter 送信　　Shift+Enter 改行</text>
</svg>
